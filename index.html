<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three Tails Tavern – Bitchen Jukebox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#020617;
  --card:#02081a;
  --border:#1f2937;
  --accent:#22c55e;
  --accent-soft:rgba(34,197,94,.2);
  --danger:#f97373;
  --text:#e5e7eb;
  --text-dim:#9ca3af;
  --radius:18px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top left,#0b1220,#020617 60%);
  font-family:var(--font);
  color:var(--text);
  height:100vh;
}
.app{
  max-width:1400px;
  margin:auto;
  padding:14px;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.title{
  font-size:1.6rem;
  font-weight:700;
}
.version{
  font-size:.75rem;
  color:var(--text-dim);
  margin-left:6px;
}
.status{
  display:flex;
  gap:8px;
  align-items:center;
}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#ef4444;
}
.status-dot.ok{background:#22c55e}
button,input{
  border-radius:999px;
  border:1px solid var(--border);
  background:#0f172a;
  color:var(--text);
  padding:10px 16px;
  font-size:1rem;
}
button{cursor:pointer;font-weight:600}
button.primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#022c22;border:none;
}
.layout{
  display:flex;
  gap:12px;
  flex:1;
  min-height:0;
}
.panel{
  flex:1;
  display:flex;
  flex-direction:column;
  background:#02081a;
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:12px;
  min-height:0;
}
.list{
  margin-top:10px;
  flex:1;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
}
.track{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-radius:12px;
}
.track:hover{background:#1f2937}
.track-main{flex:1;overflow:hidden}
.track-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:.8rem;color:var(--text-dim)}
.track-actions{display:flex;gap:6px}
.now-playing{
  display:flex;
  gap:12px;
  align-items:center;
  padding:10px;
  border:1px solid var(--border);
  border-radius:18px;
  background:#02081a;
}
.np-art{
  width:72px;height:72px;border-radius:14px;
  background:#111;background-size:cover;background-position:center;
}
.small{font-size:.8rem;color:var(--text-dim)}
.settings{
  position:fixed;inset:0;
  background:rgba(2,6,23,.95);
  display:flex;align-items:center;justify-content:center;
}
.settings-card{
  background:#02081a;
  padding:20px;
  border-radius:18px;
  border:1px solid var(--border);
  width:100%;max-width:420px;
  display:flex;flex-direction:column;gap:10px;
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <span class="title">🎧 Three Tails Tavern – Bitchen Jukebox</span>
    <span class="version">v2.4 – Full Restore</span>
  </div>
  <div class="status">
    <span class="status-dot" id="authDot"></span>
    <span id="authText">Not connected</span>
    <button id="settingsBtn">⚙️</button>
    <button id="loginBtn" class="primary">Connect</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</header>

<div class="now-playing">
  <div class="np-art" id="npArt"></div>
  <div>
    <div id="npTitle">Not playing</div>
    <div class="small" id="npArtist"></div>
    <div class="small" id="npDevice"></div>
  </div>
</div>

<div class="layout">

<div class="panel">
  <h2>Search</h2>
  <div style="display:flex;gap:8px">
    <input id="searchInput" placeholder="Search Spotify">
    <button id="searchBtn">Search</button>
  </div>
  <div class="list" id="searchResults"></div>
</div>

<div class="panel">
  <h2>Party Playlist</h2>
  <div class="list" id="playlist"></div>
</div>

</div>
</div>

<div class="settings" id="settingsModal" style="display:none">
  <div class="settings-card">
    <h3>Setup</h3>
    <input id="cfgClient" placeholder="Spotify Client ID">
    <input id="cfgRedirect" placeholder="Redirect URI">
    <input id="cfgPlaylist" placeholder="Playlist ID">
    <button class="primary" id="saveCfg">Save</button>
  </div>
</div>

<script>
const SCOPES=[
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public",
"user-read-playback-state",
"user-read-currently-playing"
];

const authDot=document.getElementById("authDot");
const authText=document.getElementById("authText");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const settingsBtn=document.getElementById("settingsBtn");

const npArt=document.getElementById("npArt");
const npTitle=document.getElementById("npTitle");
const npArtist=document.getElementById("npArtist");
const npDevice=document.getElementById("npDevice");

const settingsModal=document.getElementById("settingsModal");
const cfgClient=document.getElementById("cfgClient");
const cfgRedirect=document.getElementById("cfgRedirect");
const cfgPlaylist=document.getElementById("cfgPlaylist");

function setAuth(ok){
 authDot.classList.toggle("ok",ok);
 authText.textContent=ok?"Connected":"Not connected";
 loginBtn.style.display=ok?"none":"inline";
 logoutBtn.style.display=ok?"inline":"none";
}

function tokens(){return JSON.parse(localStorage.getItem("sj_spotify_tokens")||"null")}
async function api(url){
 const t=tokens(); if(!t) return null;
 const r=await fetch(url,{headers:{Authorization:"Bearer "+t.access_token}});
 if(!r.ok) return null;
 return r.json();
}

async function refreshNowPlaying(){
 const d=await api("https://api.spotify.com/v1/me/player");
 if(!d||!d.item){
  npTitle.textContent="Not playing";
  npArtist.textContent="";
  npDevice.textContent="";
  npArt.style.backgroundImage="";
  return;
 }
 npTitle.textContent=d.item.name;
 npArtist.textContent=d.item.artists.map(a=>a.name).join(", ");
 npDevice.textContent="Device: "+d.device.name;
 npArt.style.backgroundImage=`url(${d.item.album.images[0].url})`;
}

settingsBtn.onclick=()=>{
 cfgClient.value=localStorage.getItem("sj_client_id")||"";
 cfgRedirect.value=localStorage.getItem("sj_redirect_uri")||"";
 cfgPlaylist.value=localStorage.getItem("sj_playlist_id")||"";
 settingsModal.style.display="flex";
};

document.getElementById("saveCfg").onclick=()=>{
 localStorage.setItem("sj_client_id",cfgClient.value.trim());
 localStorage.setItem("sj_redirect_uri",cfgRedirect.value.trim());
 localStorage.setItem("sj_playlist_id",cfgPlaylist.value.trim());
 location.reload();
};

logoutBtn.onclick=()=>{
 localStorage.removeItem("sj_spotify_tokens");
 setAuth(false);
};

(async()=>{
 if(tokens()){
  setAuth(true);
  refreshNowPlaying();
  setInterval(refreshNowPlaying,15000);
 }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three Tails Tavern Bitchen Jukebox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#020617;
  --panel:#02081a;
  --accent:#22c55e;
  --text:#e5e7eb;
  --dim:#9ca3af;
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top left,#0b1220,#020617 70%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
.app{
  max-width:1100px;
  margin:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
h1{
  font-size:1.5rem;
  margin:0;
}
small{
  color:var(--dim);
  font-size:.8rem;
}
button{
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:#111827;
  color:var(--text);
  padding:10px 16px;
  font-size:1rem;
  cursor:pointer;
}
button.primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#022c22;
  border:none;
}
button.ghost{
  background:transparent;
}
.panel{
  background:radial-gradient(circle at top left,rgba(34,197,94,.12),rgba(6,10,25,.98));
  border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.15);
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.now-playing{
  display:flex;
  gap:14px;
  align-items:center;
}
.art{
  width:80px;
  height:80px;
  border-radius:14px;
  background:#020617 center/cover no-repeat;
}
.meta{
  flex:1;
}
.meta b{
  display:block;
  font-size:1.05rem;
}
.meta span{
  color:var(--dim);
  font-size:.9rem;
}
.layout{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}
.col{
  flex:1 1 480px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
input{
  padding:12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.2);
  background:#020617;
  color:var(--text);
  font-size:1rem;
}
.track{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-radius:12px;
}
.track:hover{background:rgba(255,255,255,.05)}
.msg{color:var(--dim);font-size:.85rem}
.settings{
  position:fixed;
  inset:0;
  background:rgba(2,6,23,.97);
  display:none;
  align-items:center;
  justify-content:center;
}
.settings .panel{max-width:420px;width:100%}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <h1>🎧 Three Tails Tavern Bitchen Jukebox</h1>
    <small id="version">v3.0 – playlist anchored</small>
  </div>
  <div>
    <button id="settingsBtn" class="ghost">⚙️</button>
    <button id="loginBtn" class="primary">Connect</button>
    <button id="logoutBtn" class="ghost" style="display:none">Log out</button>
  </div>
</header>

<section class="panel now-playing">
  <div class="art" id="npArt"></div>
  <div class="meta">
    <b id="npTitle">Not playing</b>
    <span id="npArtist">Waiting for Spotify…</span><br>
    <span id="npDevice"></span>
  </div>
</section>

<div class="layout">
  <div class="col panel">
    <b>Search music</b>
    <input id="searchInput" placeholder="Search Spotify…">
    <div id="searchResults"></div>
    <div class="msg" id="searchMsg"></div>
  </div>

  <div class="col panel">
    <b>Party playlist</b>
    <div id="playlist"></div>
    <div class="msg" id="playlistMsg"></div>
  </div>
</div>

</div>

<!-- SETTINGS -->
<div class="settings" id="settings">
  <div class="panel">
    <b>Setup</b>
    <input id="clientId" placeholder="Spotify Client ID">
    <input id="redirectUri" placeholder="Redirect URI">
    <input id="playlistId" placeholder="Playlist ID">
    <button class="primary" id="saveSettings">Save</button>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const VERSION="v3.0 – playlist anchored";
const SCOPES=[
 "playlist-read-private",
 "playlist-modify-private",
 "playlist-modify-public",
 "user-read-playback-state",
 "user-read-currently-playing",
 "user-modify-playback-state"
];

let tokens=null,lastTrackUri=null;

/* ================= HELPERS ================= */
const $=id=>document.getElementById(id);
const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const load=k=>JSON.parse(localStorage.getItem(k)||"null");

async function api(url,opt={}){
  opt.headers=opt.headers||{};
  opt.headers.Authorization="Bearer "+tokens.access_token;
  if(opt.body) opt.headers["Content-Type"]="application/json";
  let r=await fetch(url,opt);
  if(r.status===401) throw "auth";
  return r.status===204?null:r.json();
}

/* ================= AUTH ================= */
async function login(){
  const cid=localStorage.getItem("cid");
  const red=localStorage.getItem("redir");
  if(!cid||!red){settings.style.display="flex";return;}
  const v=crypto.randomUUID();
  const c=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));
  const cc=btoa(String.fromCharCode(...new Uint8Array(c))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
  localStorage.setItem("verifier",v);
  location=`https://accounts.spotify.com/authorize?client_id=${cid}&response_type=code&redirect_uri=${encodeURIComponent(red)}&scope=${SCOPES.join("%20")}&code_challenge_method=S256&code_challenge=${cc}`;
}

async function handleAuth(){
  const p=new URLSearchParams(location.search);
  if(!p.get("code"))return;
  const body=new URLSearchParams({
    grant_type:"authorization_code",
    code:p.get("code"),
    redirect_uri:localStorage.getItem("redir"),
    client_id:localStorage.getItem("cid"),
    code_verifier:localStorage.getItem("verifier")
  });
  const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});
  tokens=await r.json(); store("tok",tokens);
  history.replaceState({},document.title,location.pathname);
  start();
}

/* ================= UI ================= */
function setConnected(on){
  loginBtn.style.display=on?"none":"inline";
  logoutBtn.style.display=on?"inline":"none";
}

/* ================= CORE ================= */
async function refreshNow(){
  const d=await api("https://api.spotify.com/v1/me/player");
  if(!d||!d.item){npTitle.textContent="Not playing";return;}
  npTitle.textContent=d.item.name;
  npArtist.textContent=d.item.artists.map(a=>a.name).join(", ");
  npDevice.textContent="Device: "+d.device.name;
  if(d.item.album.images[0]) npArt.style.backgroundImage=`url(${d.item.album.images[0].url})`;

  if(lastTrackUri && lastTrackUri!==d.item.uri){
    await api(`https://api.spotify.com/v1/playlists/${localStorage.getItem("pid")}/tracks`,{
      method:"DELETE",
      body:JSON.stringify({tracks:[{uri:lastTrackUri}]})
    });
  }
  lastTrackUri=d.item.uri;
}

async function refreshPlaylist(){
  const p=await api(`https://api.spotify.com/v1/playlists/${localStorage.getItem("pid")}`);
  playlist.innerHTML="";
  p.tracks.items.forEach((i,idx)=>{
    const t=i.track;
    const row=document.createElement("div");
    row.className="track";
    row.innerHTML=`<span>${idx+1}. ${t.name}</span>
      <button onclick="moveNext(${idx})">⬆ Next</button>`;
    playlist.appendChild(row);
  });
}

async function moveNext(i){
  await api(`https://api.spotify.com/v1/playlists/${localStorage.getItem("pid")}/tracks`,{
    method:"PUT",
    body:JSON.stringify({range_start:i,insert_before:1})
  });
  refreshPlaylist();
}

/* ================= SEARCH ================= */
async function search(){
  const q=searchInput.value.trim(); if(!q)return;
  const r=await api(`https://api.spotify.com/v1/search?type=track&limit=6&q=${encodeURIComponent(q)}`);
  searchResults.innerHTML="";
  r.tracks.items.forEach(t=>{
    const d=document.createElement("div");
    d.className="track";
    d.innerHTML=`<span>${t.name}</span><button onclick="add('${t.uri}')">➕</button>`;
    searchResults.appendChild(d);
  });
}

async function add(uri){
  await api(`https://api.spotify.com/v1/playlists/${localStorage.getItem("pid")}/tracks`,{
    method:"POST",
    body:JSON.stringify({uris:[uri]})
  });
  // anchor playback if drifted
  await api("https://api.spotify.com/v1/me/player/play",{method:"PUT",body:JSON.stringify({context_uri:`spotify:playlist:${localStorage.getItem("pid")}`})});
  refreshPlaylist();
}

/* ================= INIT ================= */
async function start(){
  tokens=load("tok");
  if(!tokens){setConnected(false);return;}
  setConnected(true);
  await refreshPlaylist();
  await refreshNow();
  setInterval(refreshNow,15000);
}

loginBtn.onclick=login;
logoutBtn.onclick=()=>{localStorage.clear();location.reload();}
searchInput.onkeydown=e=>e.key==="Enter"&&search();
settingsBtn.onclick=()=>settings.style.display="flex";
saveSettings.onclick=()=>{
  localStorage.setItem("cid",clientId.value);
  localStorage.setItem("redir",redirectUri.value);
  localStorage.setItem("pid",playlistId.value);
  settings.style.display="none";
};

version.textContent=VERSION;
handleAuth(); start();
</script>
</body>
</html>

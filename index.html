<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Three Tails Tavern – Bitchen Jukebox</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg:#020617;
  --card:#02081a;
  --border:#1f2937;
  --accent:#22c55e;
  --accent-soft:rgba(34,197,94,.2);
  --danger:#f97373;
  --text:#e5e7eb;
  --text-dim:#9ca3af;
  --radius:18px;
  --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top left,#0b1220,#020617 60%);
  font-family:var(--font);
  color:var(--text);
  height:100vh;
}
.app{
  max-width:1400px;
  margin:auto;
  padding:14px;
  height:100%;
  display:flex;
  flex-direction:column;
  gap:12px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}
.title{
  font-size:1.6rem;
  font-weight:700;
}
.version{
  font-size:.75rem;
  color:var(--text-dim);
  margin-left:6px;
}
.status{
  display:flex;
  gap:8px;
  align-items:center;
}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:#ef4444;
}
.status-dot.ok{background:#22c55e}
button,input{
  border-radius:999px;
  border:1px solid var(--border);
  background:#0f172a;
  color:var(--text);
  padding:10px 16px;
  font-size:1rem;
}
button{
  cursor:pointer;
  font-weight:600;
}
button.primary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#022c22;
  border:none;
}
.layout{
  display:flex;
  gap:12px;
  flex:1;
  min-height:0;
}
.panel{
  flex:1;
  display:flex;
  flex-direction:column;
  background:#02081a;
  border-radius:var(--radius);
  border:1px solid var(--border);
  padding:12px;
  min-height:0;
}
.panel h2{margin:0;font-size:1.1rem}
.search-row{display:flex;gap:8px;margin-top:8px}
.list{
  margin-top:10px;
  flex:1;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
}
.track{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px;
  border-radius:12px;
}
.track:hover{background:#1f2937}
.track-main{flex:1;overflow:hidden}
.track-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:.8rem;color:var(--text-dim)}
.track-actions{display:flex;gap:6px}
.small{font-size:.8rem;color:var(--text-dim);margin-top:6px}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <span class="title">🎧 Three Tails Tavern – Bitchen Jukebox</span>
    <span class="version">v2.3 – Playlist-First Stable</span>
  </div>
  <div class="status">
    <span class="status-dot" id="authDot"></span>
    <span id="authText">Not connected</span>
    <button id="loginBtn" class="primary">Connect</button>
    <button id="logoutBtn" style="display:none">Logout</button>
  </div>
</header>

<div class="layout">

<div class="panel">
  <h2>Search Music</h2>
  <div class="search-row">
    <input id="searchInput" placeholder="Search Spotify…" />
    <button id="searchBtn">Search</button>
  </div>
  <div class="list" id="searchResults"></div>
  <div class="small" id="searchMsg"></div>
</div>

<div class="panel">
  <h2>Party Playlist</h2>
  <div class="list" id="playlist"></div>
  <div class="small" id="playlistMsg"></div>
</div>

</div>
</div>

<script>
const VERSION="v2.3 – Playlist-First Stable";
const SCOPES=[
"playlist-read-private",
"playlist-modify-private",
"playlist-modify-public",
"user-read-playback-state",
"user-read-currently-playing"
];

const CLIENT_ID=localStorage.getItem("sj_client_id");
const REDIRECT_URI=localStorage.getItem("sj_redirect_uri");
const PLAYLIST_ID=localStorage.getItem("sj_playlist_id");

const authDot=document.getElementById("authDot");
const authText=document.getElementById("authText");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");

function setAuth(ok){
 authDot.classList.toggle("ok",ok);
 authText.textContent=ok?"Connected":"Not connected";
 loginBtn.style.display=ok?"none":"inline";
 logoutBtn.style.display=ok?"inline":"none";
}

function tokens(){return JSON.parse(localStorage.getItem("sj_spotify_tokens")||"null")}

async function api(url,opt={}){
 const t=tokens();
 if(!t) throw "Not authed";
 opt.headers=Object.assign(opt.headers||{},{
  Authorization:"Bearer "+t.access_token,
  "Content-Type":"application/json"
 });
 const r=await fetch(url,opt);
 if(!r.ok) throw await r.text();
 return r.json();
}

/* ===== SEARCH ===== */
const searchBtn=document.getElementById("searchBtn");
const searchResults=document.getElementById("searchResults");
const searchMsg=document.getElementById("searchMsg");

searchBtn.onclick=async()=>{
 const q=document.getElementById("searchInput").value.trim();
 if(!q)return;
 searchMsg.textContent="Searching…";
 searchResults.innerHTML="";
 const d=await api(`https://api.spotify.com/v1/search?type=track&limit=10&q=${encodeURIComponent(q)}`);
 d.tracks.items.forEach(t=>{
  const row=document.createElement("div");
  row.className="track";
  row.innerHTML=`
   <div class="track-main">
    <div class="track-title">${t.name}</div>
    <div class="track-sub">${t.artists.map(a=>a.name).join(", ")}</div>
   </div>
   <div class="track-actions">
    <button class="primary">➕</button>
   </div>`;
  row.querySelector("button").onclick=()=>addTrack(t.uri);
  searchResults.appendChild(row);
 });
 searchMsg.textContent="Tap ➕ to add";
};

/* ===== PLAYLIST ===== */
const playlistEl=document.getElementById("playlist");
const playlistMsg=document.getElementById("playlistMsg");
let snapshot=null;

async function loadPlaylist(){
 playlistEl.innerHTML="";
 const d=await api(`https://api.spotify.com/v1/playlists/${PLAYLIST_ID}`);
 snapshot=d.snapshot_id;
 playlistMsg.textContent=`${d.tracks.items.length} tracks`;
 d.tracks.items.forEach((it,i)=>{
  const t=it.track;
  const row=document.createElement("div");
  row.className="track";
  row.innerHTML=`
   <div class="track-main">
    <div class="track-title">${i+1}. ${t.name}</div>
    <div class="track-sub">${t.artists.map(a=>a.name).join(", ")}</div>
   </div>
   <div class="track-actions">
    <button ${i<=1?"disabled":""}>▶ Next</button>
    <button>🗑</button>
   </div>`;
  row.children[1].children[0].onclick=()=>moveTrack(i,1);
  row.children[1].children[1].onclick=()=>removeTrack(i,t.uri);
  playlistEl.appendChild(row);
 });
}

async function addTrack(uri){
 await api(`https://api.spotify.com/v1/playlists/${PLAYLIST_ID}/tracks`,{
  method:"POST",body:JSON.stringify({uris:[uri]})
 });
 await loadPlaylist();
}

async function moveTrack(pos,target){
 await api(`https://api.spotify.com/v1/playlists/${PLAYLIST_ID}/tracks`,{
  method:"PUT",
  body:JSON.stringify({
   range_start:pos,
   insert_before:target,
   range_length:1,
   snapshot_id:snapshot
  })
 });
 await loadPlaylist();
}

async function removeTrack(pos,uri){
 if(!confirm("Remove this song?"))return;
 await api(`https://api.spotify.com/v1/playlists/${PLAYLIST_ID}/tracks`,{
  method:"DELETE",
  body:JSON.stringify({
   tracks:[{uri,positions:[pos]}],
   snapshot_id:snapshot
  })
 });
 await loadPlaylist();
}

/* ===== INIT ===== */
(async()=>{
 const t=tokens();
 if(t){
  setAuth(true);
  await loadPlaylist();
 }
})();
</script>
</body>
</html>
